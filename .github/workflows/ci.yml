name: CI

on:
  pull_request:
    branches: [main, 'test/**']
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @contractor-os/api test

  shared-tests:
    name: Shared Package Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared tests with coverage
        run: pnpm --filter @contractor-os/shared test:cov

      - name: Upload shared coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-coverage
          path: packages/shared/coverage
          retention-days: 7

  web-tests:
    name: Web Component Tests (Vitest + RTL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests with coverage
        run: pnpm --filter @contractor-os/web test:cov

      - name: Upload web coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7

  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @contractor-os/web storybook:build

  db-migrate-check:
    name: DB Migration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractor_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations up
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_test
        run: pnpm --filter @contractor-os/api migrate:up

      - name: Run seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: contractor_os_test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
        run: pnpm --filter @contractor-os/api seed

  api-integration:
    name: API Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # ubuntu-latest GitHub-hosted runners ship with Docker pre-installed and
    # running, which is what Testcontainers needs to spin up the ephemeral
    # postgres:16-alpine container. No `services:` block is needed here — the
    # integration suite manages its own DB lifecycle in test/setup/global-setup.ts.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run combined unit + integration suite with coverage
        run: pnpm --filter @contractor-os/api test:all:cov

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-integration-junit
          path: apps/api/coverage-integration/junit.xml
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: |
            apps/api/coverage
            apps/api/coverage-integration
          retention-days: 7

  contract-tests:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    # ubuntu-latest GitHub-hosted runners ship with Docker pre-installed and
    # running. The provider verifier spins up an ephemeral postgres:16-alpine
    # via Testcontainers so no `services:` block is needed here.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run consumer + provider verification
        run: pnpm test:contracts

      - name: Upload generated pact files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-contracts
          path: pacts/*.json
          retention-days: 30

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    # Total wall-clock for the three suites is ~7 minutes (shared 1m12s,
    # web 1m48s, api 3m43s). That puts us in the < 8 min bracket per the
    # strategy in MUTATION_TESTING.md, so we run on every PR rather than
    # gating per changed package or moving to a nightly schedule.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (api jest needs the dist source map)
        run: pnpm --filter @contractor-os/shared build

      - name: Run mutation tests across shared, api, web
        run: pnpm test:mutation:all

      - name: Upload mutation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: |
            packages/shared/reports/mutation
            apps/api/reports/mutation
            apps/web/reports/mutation
          retention-days: 30

  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    # 1-min k6 smoke against a freshly built + seeded api on docker compose.
    # The full perf suite (load/stress/spike/workflow) runs nightly via the
    # performance-nightly.yml workflow.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contractor_os
          POSTGRES_PASSWORD: contractor_os
          POSTGRES_DB: contractor_os_perf
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v1.7.1/k6-v1.7.1-linux-amd64.tar.gz | tar xz
          sudo mv k6-v1.7.1-linux-amd64/k6 /usr/local/bin/k6
          k6 --version

      - name: Build api + shared
        run: |
          pnpm --filter @contractor-os/shared build
          pnpm --filter @contractor-os/api build

      - name: Seed perf data
        env:
          DATABASE_URL: postgresql://contractor_os:contractor_os@localhost:5434/contractor_os_perf
        run: pnpm --filter @contractor-os/api exec tsx performance/seed-perf-data.ts

      - name: Start api
        env:
          DATABASE_URL: postgresql://contractor_os:contractor_os@localhost:5434/contractor_os_perf
          JWT_SECRET: perf-jwt-secret
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          PORT: '3001'
          NODE_ENV: production
          CORS_ORIGIN: http://localhost:3000
        run: |
          pnpm --filter @contractor-os/api start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health; then break; fi
            sleep 1
          done

      - name: Run k6 smoke
        run: |
          mkdir -p performance/results
          k6 run --summary-export=performance/results/smoke-ci.json performance/k6/smoke.js

      - name: Upload smoke summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-summary
          path: performance/results/smoke-ci.json
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractor_os_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_e2e
        run: pnpm --filter @contractor-os/api migrate:up

      - name: Seed database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_e2e
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: contractor_os_e2e
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
        run: pnpm --filter @contractor-os/api seed

      - name: Build all packages
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: pnpm build

      - name: Start API server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/contractor_os_e2e
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          PORT: 3001
        run: pnpm --filter @contractor-os/api start &

      - name: Start web server
        run: pnpm --filter @contractor-os/web start &

      - name: Install Cypress binary
        run: pnpm --filter @contractor-os/web exec cypress install

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: apps/web
          install: false
          wait-on: 'http://localhost:3001/api/v1/health, http://localhost:3000'
          wait-on-timeout: 120

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            apps/web/cypress/screenshots
            apps/web/cypress/videos
          retention-days: 7
