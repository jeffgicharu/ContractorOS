name: Container & Filesystem Scan (Trivy)

# Two scans:
#   1. trivy fs ./       — secrets, IaC misconfigs, dependency CVEs from
#                          source manifests. Catches issues before any
#                          image is built.
#   2. trivy image       — scans the built api image for OS-level and
#                          language-level CVEs in the layered filesystem.
# Both upload SARIF to GitHub code scanning so findings appear in the
# Security tab and PR review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '13 5 * * *' # daily 05:13 UTC

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy fs scan (secrets + manifest CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
          scanners: 'vuln,secret,misconfig'

      - name: Upload fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: contractor-os-api:scan

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: contractor-os-api:scan
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
