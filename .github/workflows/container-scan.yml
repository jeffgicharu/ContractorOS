name: Container & Filesystem Scan (Trivy)

# Two scans:
#   1. trivy fs ./       — secrets, IaC misconfigs, dependency CVEs from
#                          source manifests. Catches issues before any
#                          image is built.
#   2. trivy image       — scans the built api image for OS-level and
#                          language-level CVEs in the layered filesystem.
# Both upload SARIF to GitHub code scanning so findings appear in the
# Security tab and PR review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '13 5 * * *' # daily 05:13 UTC

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two passes so the build fails on a clear, human-readable report
      # AND a SARIF still lands in code-scanning. SARIF format alone
      # does not echo findings to the job log.
      - name: Trivy fs scan (table — fail-on-findings)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: table
          scanners: 'vuln,secret,misconfig'
          # Skip transitive test-fixture Dockerfiles inside node_modules
          # (e.g. getos/tests/...). They are not our code and not shipped.
          # Real CVEs in node_modules still surface via the pnpm scanner.
          skip-dirs: node_modules

      - name: Trivy fs scan (SARIF — code scanning upload)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
          scanners: 'vuln,secret,misconfig'
          skip-dirs: node_modules

      - name: Upload fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: contractor-os-api:scan

      - name: Trivy image scan (table — fail-on-findings)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: contractor-os-api:scan
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: table
          # The bundled npm CLI inside the node:22-alpine base image
          # ships with its own picomatch. We do not invoke npm at
          # runtime (the image runs node directly on dist/main.js), so
          # the base-image npm tree is not exposed. Skip its node_modules
          # to keep the gate strict on the app surface that actually
          # serves traffic.
          skip-dirs: 'usr/local/lib/node_modules/npm'

      - name: Trivy image scan (SARIF — code scanning upload)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: contractor-os-api:scan
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          skip-dirs: 'usr/local/lib/node_modules/npm'

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
