name: Performance Full Suite (nightly)

# Runs the full k6 perf suite (load + stress + spike + workflow) at 03:00
# UTC daily against a freshly built + seeded api. Each test takes its full
# documented duration so the captured baselines are realistic.
#
# Triggers:
#   - schedule (cron 0 3 * * *)
#   - workflow_dispatch (manual)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: performance-nightly
  cancel-in-progress: false

jobs:
  performance-full-suite:
    name: Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contractor_os
          POSTGRES_PASSWORD: contractor_os
          POSTGRES_DB: contractor_os_perf
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v1.7.1/k6-v1.7.1-linux-amd64.tar.gz | tar xz
          sudo mv k6-v1.7.1-linux-amd64/k6 /usr/local/bin/k6
          k6 --version

      - name: Build api + shared
        run: |
          pnpm --filter @contractor-os/shared build
          pnpm --filter @contractor-os/api build

      - name: Seed perf data
        env:
          DATABASE_URL: postgresql://contractor_os:contractor_os@localhost:5434/contractor_os_perf
        run: pnpm --filter @contractor-os/api exec tsx performance/seed-perf-data.ts

      - name: Start api
        env:
          DATABASE_URL: postgresql://contractor_os:contractor_os@localhost:5434/contractor_os_perf
          JWT_SECRET: perf-jwt-secret
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          PORT: '3001'
          NODE_ENV: production
          CORS_ORIGIN: http://localhost:3000
        run: |
          pnpm --filter @contractor-os/api start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/v1/health; then break; fi
            sleep 1
          done

      - name: Run k6 load
        if: always()
        run: |
          mkdir -p performance/results
          k6 run --summary-export=performance/results/load.json performance/k6/load.js || true

      - name: Run k6 stress
        if: always()
        run: |
          k6 run --summary-export=performance/results/stress.json performance/k6/stress.js || true

      - name: Run k6 spike
        if: always()
        run: |
          k6 run --summary-export=performance/results/spike.json performance/k6/spike.js || true

      - name: Run k6 workflow
        if: always()
        run: |
          k6 run --summary-export=performance/results/workflow.json performance/k6/workflow.js || true

      - name: Upload all summaries + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-nightly-${{ github.run_number }}
          path: performance/results/
          retention-days: 30
