name: Dependency Audit (pnpm)

# Fallback dependency scan that runs even when SNYK_TOKEN is not set.
# Uses pnpm's built-in audit which queries the npm advisory database.
# Less rich than Snyk (no fix-suggestions, no SCA, no license analysis)
# but it costs nothing and keeps the repo continuously scanned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * *' # daily 04:47 UTC

concurrency:
  group: pnpm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit --audit-level=high
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+critical fail the build)
        run: pnpm audit --audit-level=high
