name: DAST (OWASP ZAP)

# Dynamic application security test against a running api.
#
# Runs on a weekly cron (too slow for every PR) and on manual dispatch.
# Brings up the perf-target docker compose, applies migrations, starts
# the api, then runs ZAP's API-aware scan against /api/v1.

on:
  schedule:
    - cron: '7 6 * * 1' # weekly Monday 06:07 UTC
  workflow_dispatch:

concurrency:
  group: zap
  cancel-in-progress: false

jobs:
  zap-api-scan:
    name: ZAP API scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api + shared
        run: |
          pnpm --filter @contractor-os/shared build
          pnpm --filter @contractor-os/api build

      - name: Start docker compose target
        run: docker compose -f docker-compose.perf.yml up -d

      - name: Wait for api health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/v1/health; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never came up"; docker compose -f docker-compose.perf.yml logs perf-api; exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://localhost:3001/api/v1/health'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'
          cmd_options: '-J zap-baseline.json -w zap-baseline.md'

      - name: Run ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:3001/api/v1/health'
          format: openapi
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-api-scan-report'
          cmd_options: '-J zap-api-scan.json -w zap-api-scan.md'

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.perf.yml down -v
