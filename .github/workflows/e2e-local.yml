name: E2E Local (Playwright + curl)

# Runs the full local Playwright suite + curl-local sweep against a
# docker-compose-style local stack (postgres + api + web prod build)
# on every PR. Chromium + Firefox + WebKit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    name: E2E Local (Playwright + curl)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contractor_os
          POSTGRES_PASSWORD: contractor_os
          POSTGRES_DB: contractor_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://contractor_os:contractor_os@localhost:5432/contractor_os
      JWT_SECRET: ci-e2e-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      PORT: '3001'
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: pnpm --filter @contractor-os/web exec playwright install --with-deps chromium firefox webkit

      - name: Run migrations
        run: pnpm --filter @contractor-os/api migrate:up

      - name: Seed DB
        run: pnpm --filter @contractor-os/api seed

      - name: Build api + web
        run: |
          pnpm --filter @contractor-os/shared build
          pnpm --filter @contractor-os/api build
          pnpm --filter @contractor-os/web build

      - name: Start api + web and wait for stack
        run: |
          # Direct node invocation avoids pnpm/turbo wrapper races that
          # caused the api process to be spawned twice and trip
          # EADDRINUSE on port 3001.
          nohup node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          nohup node apps/web/node_modules/next/dist/bin/next start --dir apps/web --port 3000 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid

          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3001/api/v1/health -o /dev/null && \
               curl -fsS http://localhost:3000 -o /dev/null; then
              echo "stack up after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "===== api.log tail ====="; tail -80 /tmp/api.log || true
          echo "===== web.log tail ====="; tail -80 /tmp/web.log || true
          echo "stack failed to come up"
          exit 1

      - name: Run curl-local endpoint sweep
        run: |
          mkdir -p e2e-results
          CURL_OUT=e2e-results/curl-local.md bash scripts/verify-endpoints-local.sh

      - name: Run Playwright local suite
        run: pnpm --filter @contractor-os/web exec playwright test --project=local-chromium --project=local-firefox --project=local-webkit

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload curl-local results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curl-local-results
          path: e2e-results/curl-local.md
          retention-days: 14
